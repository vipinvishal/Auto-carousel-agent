name: VipinAIHub Carousel Agent

on:
  schedule:
    - cron: '30 4 * * *'   # 10:00 AM IST
    - cron: '30 11 * * *'  # 5:00 PM IST
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab anytime

jobs:
  check-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit last_story.txt back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright + Chromium
        run: playwright install --with-deps chromium

      - name: Fetch trending topic and run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python check_trends.py

      - name: Save updated last_story.txt to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_story.txt
          git diff --staged --quiet || git commit -m "chore: update last processed story ID"
          git push
