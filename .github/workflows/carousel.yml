name: YouTube Carousel Agent

on:
  schedule:
    # Runs every 2 days at 9:00 AM UTC (2:30 PM IST)
    - cron: '0 9 */2 * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab anytime

jobs:
  check-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit last_video.txt back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright + Chromium
        run: playwright install --with-deps chromium

      - name: Check for new video and run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python check_video.py

      - name: Save updated last_video.txt to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_video.txt
          git diff --staged --quiet || git commit -m "chore: update last processed video ID"
          git push
