name: vipinislearning approved AI Threads carousel

on:
  schedule:
    - cron: '30 3 * * *'   # 09:00 IST
    - cron: '30 6 * * *'   # 12:00 IST
    - cron: '30 11 * * *'  # 17:00 IST
  workflow_dispatch:
    inputs:
      slot:
        description: 'IST delivery slot'
        required: true
        default: '0900'
        type: choice
        options:
          - '0900'
          - '1200'
          - '1700'
      test_fallback:
        description: 'Use the approved evergreen lesson instead of live research for a safe email test'
        required: false
        default: false
        type: boolean
      reference_lock:
        description: 'Attach the exact five owner-approved LLM PNGs'
        required: false
        default: false
        type: boolean
      topic:
        description: 'Optional topic override for a manual preview'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'rag'
          - 'prompting'
          - 'agents'
          - 'llm'

permissions:
  contents: read

concurrency:
  group: approved-carousel-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  build-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Load carousel skill rules
        run: python -c "import json; data=json.load(open('config/viral_carousel_rules.json')); assert data['story_arc'] == ['curiosity', 'tension', 'insight', 'payoff']; print('Viral carousel rulebook loaded')"

      - name: Resolve delivery slot
        id: slot
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
            echo "fallback=${{ inputs.test_fallback }}" >> "$GITHUB_OUTPUT"
            echo "reference=${{ inputs.reference_lock }}" >> "$GITHUB_OUTPUT"
            echo "topic=${{ inputs.topic }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "30 3 * * *") slot="0900" ;;
              "30 6 * * *") slot="1200" ;;
              "30 11 * * *") slot="1700" ;;
              *) echo "Unexpected schedule: ${{ github.event.schedule }}"; exit 1 ;;
            esac
            echo "slot=$slot" >> "$GITHUB_OUTPUT"
            echo "fallback=false" >> "$GITHUB_OUTPUT"
            echo "reference=false" >> "$GITHUB_OUTPUT"
            echo "topic=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate, validate, and email package
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-2.5-sunburst
          OPENAI_IMAGE_QUALITY: high
          CAROUSEL_SLOT: ${{ steps.slot.outputs.slot }}
          CAROUSEL_TOPIC: ${{ steps.slot.outputs.topic }}
        shell: bash
        run: |
          TOPIC_ARGS=()
          if [ "$CAROUSEL_TOPIC" != "auto" ]; then
            TOPIC_ARGS+=(--topic "$CAROUSEL_TOPIC")
          fi
          if [ "${{ steps.slot.outputs.reference }}" = "true" ]; then
            python src/automation.py --slot "$CAROUSEL_SLOT" --send --reference-lock
          elif [ "${{ steps.slot.outputs.fallback }}" = "true" ]; then
            python src/automation.py --slot "$CAROUSEL_SLOT" --send --force-fallback "${TOPIC_ARGS[@]}"
          else
            if [ -z "$OPENAI_API_KEY" ]; then
              echo "::error::OPENAI_API_KEY is required. Refusing to email the rejected Pillow-rendered images."
              exit 1
            fi
            python src/automation.py --slot "$CAROUSEL_SLOT" --send "${TOPIC_ARGS[@]}"
          fi

      - name: Upload failed-run package for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-carousel-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
